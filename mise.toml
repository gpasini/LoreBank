# Un mise antérieur ignorerait `monorepo_root` en silence (plus aucune tâche
# `//backend:*`) : la borne le fait échouer bruyamment à la place.
min_version = "2026.9.0"
monorepo_root = true

# `jq` sert aux hooks de `.claude/settings.json` (ADR 0033) : ils reçoivent
# leur entrée en JSON sur stdin. Épinglé ici comme dotnet et node le sont dans
# leurs configs — `mise install` le pose, et un parseur JSON en sed n'en
# serait pas un.
[tools]
jq = "1"

[monorepo]
config_roots = [
    "backend",
    "frontend",
]

# Les portes de qualité (ADR 0028, docs/qualite.md) : chaque tâche ci-dessous
# est un step de la CI, appelé tel quel — même commande sur le poste et sur
# le runner. `check` les rejoue toutes, dans l'ordre, en s'arrêtant au premier
# rouge.
[tasks.check]
description = "Toutes les gates, comme la CI"
run = [
    "mise run //backend:build",
    "mise run //backend:format:check",
    "mise run //backend:openapi:check",
    "mise run //backend:test",
    "mise run //frontend:generate",
    "mise run //frontend:typecheck",
    "mise run //frontend:check",
    "mise run //frontend:audit",
    # L'horodatage que lit `hook:verify` (ADR 0033) : écrit en dernier, donc
    # seulement si tout est vert. Ce n'est pas une Porte — le Gel distingue
    # les huit au préfixe `mise run //`.
    "mkdir -p .claude && touch .claude/.gates-ran",
]

# Les gates rapides avant un commit — jamais la suite d'intégration.
# Opt-in, rien dans .git n'est versionné : `mise generate git-pre-commit --write`.
[tasks.pre-commit]
description = "Format et lint, avant un commit (installer : mise generate git-pre-commit --write)"
run = [
    "mise run //backend:format:check",
    "mise run //frontend:check",
]

# Les hooks de `.claude/settings.json` (ADR 0033) n'appellent que ces trois
# tâches : la logique vit ici, avec les portes, donc elle se rejoue à la main
# hors de Claude Code — `mise run hook:verify` répond la même chose dans un
# terminal. Un hook impose le moment d'un garde-fou existant, jamais une règle.
# `quiet` parce que leur sortie n'est pas lue par un humain : stderr devient
# le motif du refus que l'agent reçoit, stdout le contexte qu'on lui pose.
[tasks."hook:verify"]
description = "Hook Stop : rappelle une fois que les portes n'ont pas tourné depuis la dernière édition"
quiet = true
run = '''
input=$(cat)

# Le garde anti-boucle : après notre blocage, Claude repasse ici avec ce
# drapeau levé. Un rappel par tour, jamais deux — le plafond dur de huit
# blocages consécutifs ne sert jamais.
if [ "$(printf %s "$input" | jq -r ".stop_hook_active // false")" = "true" ]; then
  exit 0
fi

stamp=.claude/.gates-ran

if [ -f "$stamp" ]; then
  # Les fichiers suivis seulement. Les non suivis ont été retirés du scan :
  # ils rendaient le rappel bavard sans rien apprendre — un brouillon, un
  # fichier de sortie posé à côté, et le tour était marqué périmé. Le prix
  # est connu et assumé : un .cs créé et jamais ajouté passe sous le radar
  # jusqu'à son premier `git add`.
  declencheur=
  for fichier in $(git ls-files); do
    if [ -e "$fichier" ] && [ "$fichier" -nt "$stamp" ]; then
      declencheur=$fichier
      break
    fi
  done
  [ -z "$declencheur" ] && exit 0
fi

# Comme dans hook:generated : un heredoc passé en argument ou logé dans un
# bras de `case` est avalé par le parseur. En fonction, il tient.
rappel() {
  cat <<'STALE'
mise run check n'a pas tourné depuis la dernière édition : rien ne prouve que
les portes passent (ADR 0028, docs/qualite.md). Lance-le, puis reprends.

Si tu t'arrêtes délibérément — une question à poser, un choix à faire
trancher — c'est légitime : redis-le simplement, ce rappel ne reviendra pas
dans ce tour.
STALE
}

bloquer() {
  jq -n --arg raison "$1" '{ decision: "block", reason: $raison }'
  exit 0
}

# Les portes rapides d'abord : leur sortie dit *quoi* corriger, là où le
# rappel seul dirait seulement d'aller voir.
if ! sortie=$(mise run pre-commit 2>&1); then
  bloquer "$(printf '%s\n\n%s' "$sortie" "Les portes rapides sont rouges (ADR 0028, docs/qualite.md). Corrige, puis relance mise run check.")"
fi

if [ -n "$declencheur" ]; then
  bloquer "$(printf '%s\n\nDernière édition non couverte : %s' "$(rappel)" "$declencheur")"
fi

bloquer "$(rappel)"
'''

[tasks."hook:generated"]
description = "Hook PreToolUse : refuse l'édition à la main d'un fichier généré, et donne le geste correct"
quiet = true
run = '''
path=$(cat | jq -r ".tool_input.file_path // empty")

# Les gestes en fonctions : un heredoc dans un bras de `case` est avalé par
# le parseur avant que le bras soit choisi.
geste_openapi() {
  cat <<'GESTE'
La Description OpenAPI est émise par le build de l'hôte (ADR 0019) :
  cd backend && mise exec -- dotnet build LoreBank.slnx
puis commite le diff. La CI rejette un fichier divergent (openapi:check).
GESTE
}

geste_migration() {
  cat <<'GESTE'
Une migration de schéma se génère, jamais ne s'écrit (skill
`nouvelle-migration-schema`) :
  cd backend && mise exec -- dotnet tool run dotnet-ef migrations add <Nom> ...
C'est la seule des trois familles générées qu'aucune porte ne rattrape : une
retouche à la main ici passerait la CI et casserait la base au déploiement.
GESTE
}

geste_client() {
  cat <<'GESTE'
Le Client TypeScript est généré depuis la Description :
  cd frontend && mise exec -- npm run generate
Le fichier est gitignoré : une retouche serait perdue au prochain `npm ci`.
Une forme wire qui doit diverger se change côté back, dans la surface
Application du module (ADR 0012).
GESTE
}

case "$path" in
  */backend/openapi/lorebank.json) geste=$(geste_openapi) ;;
  *ModelSnapshot.cs|*.Designer.cs) geste=$(geste_migration) ;;
  */frontend/src/api/schema.d.ts) geste=$(geste_client) ;;
  *) exit 0 ;;
esac

# Le contrat JSON documenté plutôt qu'un exit 2 : lui seul porte le motif
# sans que la ligne d'échec de mise vienne s'y coller.
jq -n --arg raison "$path est un fichier généré, il ne se modifie pas à la main.

$geste" '{
  hookSpecificOutput: {
    hookEventName: "PreToolUse",
    permissionDecision: "deny",
    permissionDecisionReason: $raison
  }
}'
'''

[tasks."hook:skills"]
description = "Hook SessionStart : énumère les skills réellement installées"
quiet = true
run = '''
# La table est dérivée de `.claude/skills/`, jamais codée en dur : une table
# écrite à la main ment dès qu'une skill est ajoutée ou renommée. Le routage
# geste → skill, lui, vit dans CLAUDE.md (ADR 0034) — celui-ci dit seulement
# ce qui est réellement installé.
echo "Skills de ce repo (.claude/skills/). Invoque celle du geste avant"
echo "d'écrire : elle porte la recette, ses garde-fous, et l'ordre de"
echo "l'ADR 0032 — squelette, test, RED observé, corps. Le routage complet"
echo "est dans CLAUDE.md."
echo

for fichier in .claude/skills/*/SKILL.md; do
  [ -e "$fichier" ] || continue
  nom=$(sed -n 's/^name: *//p' "$fichier" | head -1)
  description=$(sed -n 's/^description: *//p' "$fichier" | head -1)
  printf -- '- %s : %s\n' "$nom" "$description"
done
'''
