# Le quality gate du repo : rien ne se merge sans build sans warning
# (TreatWarningsAsErrors le rend bloquant) ni suite complète — les tests
# d'architecture du socle y jouent le rôle de relecture. Le SDK vient de mise,
# comme sur le poste : backend/mise.toml + global.json restent la source
# unique de la toolchain.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          working_directory: backend

      - name: Build
        run: mise exec -- dotnet build LoreBank.slnx

      # Le build de l'hôte émet backend/openapi/lorebank.json (ADR 0019) : si
      # le fichier commité diverge de la surface réelle, la Description est
      # périmée — rebuild en local et commiter le diff.
      - name: Description OpenAPI à jour
        run: |
          if ! git diff --exit-code -- openapi/; then
            echo "::error::backend/openapi/lorebank.json diverge du build : relancer dotnet build et commiter le fichier."
            exit 1
          fi

      # Testcontainers démarre son PostgreSQL sur le Docker du runner.
      - name: Test
        run: mise exec -- dotnet test LoreBank.slnx --no-build

  # Le Client TypeScript se génère depuis le fichier commité et doit compiler :
  # c'est ce job qui matérialise « le front est complet sur les codes d'erreur
  # ou ne compile pas » (src/api/errorMessages.ts est typé sur ErrorCode).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          working_directory: frontend

      - name: Install
        run: mise exec -- npm ci

      - name: Generate client
        run: mise exec -- npm run generate

      - name: Typecheck
        run: mise exec -- npm run typecheck
