# Les portes de qualité du repo (ADR 0028, docs/qualite.md) : rien ne se
# merge sans build sans warning (TreatWarningsAsErrors, API bannies,
# analyseurs), format déclaré, Description OpenAPI à jour, suite complète,
# front typé, linté, formaté et sans vulnérabilité high. Chaque step est
# une tâche mise, appelée telle quelle — `mise run check` rejoue la même
# liste sur le poste. Le SDK vient de mise, comme sur le poste :
# backend/mise.toml + global.json restent la source unique de la toolchain.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          working_directory: backend

      - name: Build
        run: mise run build

      # `dotnet format --verify-no-changes` : whitespace, règles de style IDE
      # et analyseurs, tels que .editorconfig les déclare.
      - name: Format
        run: mise run format:check

      # Le build de l'hôte émet backend/openapi/lorebank.json (ADR 0019) : si
      # le fichier commité diverge de la surface réelle, la Description est
      # périmée — rebuild en local et commiter le diff.
      - name: Description OpenAPI à jour
        run: mise run openapi:check

      # Testcontainers démarre son PostgreSQL sur le Docker du runner. Les
      # tests d'architecture du socle y jouent le rôle de relecture.
      - name: Test
        run: mise run test

      # La couverture est une mesure, pas une porte (ADR 0029) : hors de
      # `mise run check`, elle ne rougit jamais. Le résumé par assembly va
      # dans la page du run, le HTML en artefact.
      - name: Coverage
        run: |
          mise run coverage
          cat coverage/report/Summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage/report

  # Le Client TypeScript se génère depuis le fichier commité et doit compiler :
  # c'est ce job qui matérialise « le front est complet sur les codes d'erreur
  # ou ne compile pas » (src/api/errorMessages.ts est typé sur ErrorCode).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          working_directory: frontend

      - name: Install
        run: mise run install

      - name: Generate client
        run: mise run generate

      - name: Typecheck
        run: mise run typecheck

      # Biome : lint et format en un geste, `mise run format` corrige.
      - name: Lint and format
        run: mise run check

      # Dépendances de dev incluses : elles s'exécutent sur le poste et ici.
      - name: Audit
        run: mise run audit
